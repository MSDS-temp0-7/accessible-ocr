[project]
name = "daisy-ocr"
version = "0.1.0"
description = "Local OCR and layout pipeline for the Accessible OCR Windows app"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy",
    "opencv-python",
    "pillow",
    "lxml",
    "pypdfium2",
    "doclayout-yolo>=0.0.4,<0.0.5",
    "huggingface-hub",
    "torch>=2.5,<3.0",
    "onnx",
    "onnxruntime",
    "psutil",
    "datasets>=5.0.1,<6.0.0",
    "matplotlib>=3.11.1,<4.0.0",
    "fastapi>=0.141.1,<0.142.0",
    "uvicorn>=0.52.3,<0.53.0",
    "python-multipart>=0.0.32,<0.0.33",
    "openai>=3.3.0,<4.0.0",
    "python-dotenv>=1.2.3,<2.0.0",
    "rapidocr>=3.9.2,<4.0.0",
    "httpx>=0.28.1,<0.29.0",
]

[project.scripts]
daisy-ocr-api = "daisy_ocr.server:run"

[tool.poetry]
packages = [{ include = "daisy_ocr" }]

[tool.poetry.group.dev.dependencies]
pytest = "*"
ruff = "*"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
